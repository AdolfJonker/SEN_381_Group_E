# Render Blueprint for CivicConnect staging (Adolf M3).
# Secrets (DB_PASSWORD, etc.) are set in the Render dashboard — never committed.

services:
  - type: web
    name: civicconnect-staging
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SERVER_PORT
        value: "8080"
      # Set these in the Render dashboard after the DB is created.
      # Use a JDBC URL, e.g. jdbc:postgresql://HOST:5432/civicconnect
      - key: DB_JDBC_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: civicconnect-db
    plan: free
    databaseName: civicconnect
    user: civicconnect
