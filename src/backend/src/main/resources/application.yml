spring:
  application:
    name: civicconnect
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        # CSRF protection is off for the JSON API, so the session cookie must not be sent
        # by other sites (SameSite=Strict). HttpOnly stops page scripts reading it.
        http-only: true
        same-site: strict

# Comma-separated browser origins allowed to call the API with cookies.
# Staging same-origin deploys can leave the Vite defaults; split UI hosts add their URL here.
civicconnect:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # RISK-004: demo accounts are off unless switched on. The password has no default here,
  # so postgres/staging can never start with a known password.
  demo-users:
    enabled: ${DEMO_USERS_ENABLED:false}
    password: ${DEMO_PASSWORD:}

---
# Real PostgreSQL database (default for local and hosting)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/civicconnect}
    username: ${DB_USER:civicconnect}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Shared schema + PostgreSQL-only NFR004 append-only triggers (V2)
    locations: classpath:db/migration,classpath:db/migration-postgres
    # A database whose tables were created before Flyway ran is treated as already at V1.
    baseline-on-migrate: true

---
# In-memory H2 for quick local runs without PostgreSQL
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:civicconnect;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # H2 cannot run PostgreSQL trigger functions; shared V1 only (see TD-006)
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

# Demo profile only (local, in-memory H2): demo accounts on. Override with DEMO_PASSWORD.
civicconnect:
  demo-users:
    enabled: true
    password: ${DEMO_PASSWORD:Password123!}
