spring:
  application:
    name: civicconnect
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}

server:
  port: ${SERVER_PORT:8080}

---
# Real PostgreSQL database (default for local and hosting)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/civicconnect}
    username: ${DB_USER:civicconnect}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

---
# In-memory H2 for quick local runs without PostgreSQL
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:civicconnect;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
