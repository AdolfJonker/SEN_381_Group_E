# In-memory H2 demo — no Postgres password required
spring.datasource.url=jdbc:h2:mem:civicconnect;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Demo seed users share one password, read from the DEMO_PASSWORD environment variable.
# If it is not set, a random password is generated and printed in the startup log.
civicconnect.demo-password=${DEMO_PASSWORD:}
