spring.application.name=civicconnect
spring.profiles.active=demo

# 8080 is often already taken on Windows; use 8081 for local demos
server.port=8081

# Browser origins allowed to call the API (comma-separated). Override on staging.
civicconnect.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
